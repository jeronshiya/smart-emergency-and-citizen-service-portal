<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Citizen Registration</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

</head>


<body class="bg-dark" style="background: #071A2B !important;">


<!-- Navbar -->

<nav class="navbar navbar-dark bg-primary">

<div class="container">

<a class="navbar-brand fw-bold d-flex align-items-center" href="/">

<img src="{{ url_for('static', filename='images/logo.png') }}" alt="Logo" class="navbar-logo me-3">

<span>Smart Emergency Portal</span>

</a>

</div>

</nav>

<main>

<!-- Register Form -->


<div class="container mt-5">


<div class="row justify-content-center">


<div class="col-lg-6">


<div class="card shadow p-4">


<h2 class="text-center text-primary mb-4">

Citizen Registration

</h2>



<form action="/register" method="POST">



<!-- Full Name -->

<div class="mb-3">

<label class="form-label">

Full Name

</label>


<input 
type="text"
name="full_name"
class="form-control"
placeholder="Enter your name"
required>

</div>




<!-- Email -->

<div class="mb-3">

<label class="form-label">

Email

</label>


<input 
type="email"
name="email"
class="form-control"
placeholder="Enter email"
required>

</div>




<!-- Mobile -->

<div class="mb-3">

<label class="form-label">

Mobile Number

</label>


<input 
type="tel"
name="mobile"
class="form-control"
placeholder="Enter mobile number"
required>

</div>


<!-- Category -->

<div class="mb-3">

<label class="form-label">

Category

</label>

<select name="category" class="form-select" required>
    <option value="Citizen">Citizen</option>
    <option value="Volunteer">Volunteer</option>
    <option value="NGO Worker">NGO Worker</option>
    <option value="Health Worker">Health Worker</option>
    <option value="Other">Other</option>
</select>

</div>


<!-- Password -->

<div class="mb-3">

<label class="form-label">

Password

</label>


<input 
type="password"
name="password"
class="form-control"
placeholder="Create password"
required>

</div>




<!-- Address -->

<div class="mb-3">

<label class="form-label">

Address

</label>


<textarea 
name="address"
class="form-control"
rows="3"
placeholder="Enter address">

</textarea>


</div>




<!-- City -->

<div class="mb-3">

<label class="form-label">

City

</label>


<input 
type="text"
name="city"
class="form-control"
placeholder="Enter city">

</div>




<!-- Pincode -->

<div class="mb-3">

<label class="form-label">

Pincode

</label>


<input 
type="text"
name="pincode"
class="form-control"
placeholder="Enter pincode">

</div>




<!-- Button -->

<div class="d-grid">


<button type="submit" class="btn btn-primary btn-lg">

Register

</button>


</div>



</form>



<div class="text-center mt-3">

<p>

Already have an account?

<a href="/login">

Login

</a>

</p>

</div>



</div>


</div>


</div>


</div>

</main>


<footer class="bg-dark text-white text-center p-3 mt-5">

<h5>Smart Emergency & Citizen Service Portal</h5>

<p>© 2026 All Rights Reserved.</p>

</footer>



<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>


</body>

</html>
