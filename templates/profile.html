<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Citizen Profile</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body>

<!-- Navbar -->

<nav class="navbar navbar-expand-lg navbar-dark bg-primary">

<div class="container">

<a class="navbar-brand fw-bold d-flex align-items-center" href="/dashboard">
<img src="{{ url_for('static', filename='images/logo.png') }}" alt="Logo" class="navbar-logo me-3">
<span>Smart Emergency</span>
</a>

<div>

<a href="/dashboard" class="btn btn-light me-2">
Dashboard
</a>

<a href="/" class="btn btn-danger">
Logout
</a>

</div>

</div>

</nav>

<main>
<!-- Profile -->

<div class="container mt-5">

<div class="row">

<div class="col-lg-4">

<div class="card shadow text-center p-4">

<img src="https://via.placeholder.com/180"
class="rounded-circle mx-auto mb-3"
width="180">

<h3>Roslin Jeronshiya</h3>

<p class="text-muted">
Citizen
</p>

<hr>

<p>
<i class="bi bi-envelope-fill"></i>

roslin@email.com

</p>

<p>

<i class="bi bi-telephone-fill"></i>

9876543210

</p>

<p>

<i class="bi bi-geo-alt-fill"></i>

Karur, Tamil Nadu

</p>

</div>

</div>

<div class="col-lg-8">

<div class="card shadow p-4">

<h3 class="mb-4">

Personal Information

</h3>

<form>

<div class="row">

<div class="col-md-6 mb-3">

<label>

Full Name

</label>

<input
type="text"
class="form-control"
value="{{ user.full_name }}">

</div>

<div class="col-md-6 mb-3">

<label>

Email

</label>

<input
type="email"
class="form-control"
value="{{ user.email }}">

</div>

</div>

<div class="row">

<div class="col-md-6 mb-3">

<label>

Mobile

</label>

<input
type="text"
class="form-control"
value="{{ user.mobile }}">

</div>

<div class="col-md-6 mb-3">

<label>

City

</label>

<input
type="text"
class="form-control"
value="{{ user.city }}">

</div>

</div>

<div class="mb-3">

<label>

Address

</label>

<textarea
class="form-control"
rows="4">

{{ user.address }}

</textarea>

</div>

<div class="d-grid">

<button class="btn btn-primary btn-lg">

Update Profile

</button>

</div>

</form>

</div>

</div>

</div>

</div>

<!-- Activity -->

<div class="container mt-5">

<div class="row">

<div class="col-md-4">

<div class="card text-center shadow p-4">

<h2 class="text-danger">

5

</h2>

<p>

SOS Requests

</p>

</div>

</div>

<div class="col-md-4">

<div class="card text-center shadow p-4">

<h2 class="text-primary">

12

</h2>

<p>

Complaints

</p>

</div>

</div>

<div class="col-md-4">

<div class="card text-center shadow p-4">

<h2 class="text-success">

8

</h2>

<p>

Resolved

</p>

</div>

</div>

</div>

</div>

<footer class="bg-dark text-white text-center mt-5 p-3">

© 2026 Smart Emergency & Citizen Service Portal

</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</main>

<footer class="bg-dark text-white text-center py-4">
<h5>Smart Emergency & Citizen Service Portal</h5>
<p>© 2026 All Rights Reserved.</p>
</footer>

</body>
</html>
