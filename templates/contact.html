<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Contact | Smart Emergency Portal</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
	<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="bg-dark">
	<nav class="navbar navbar-dark bg-primary shadow">
		<div class="container">
			<a class="navbar-brand fw-bold d-flex align-items-center" href="/"><img src="{{ url_for('static', filename='images/logo.png') }}" alt="Logo" class="navbar-logo me-3"><span>Smart Emergency</span></a>
			<div>
				<a href="/" class="btn btn-light me-2">Home</a>
				<a href="/about" class="btn btn-outline-light">About</a>
			</div>
		</div>
	</nav>

<main>
	<main class="container py-5">
		<div class="row justify-content-center">
			<div class="col-lg-8">
				<div class="card shadow p-4 p-md-5">
					<h1 class="text-primary mb-3">Contact Us</h1>
					<p class="text-muted">For emergency help, use the SOS service. For general support, send us a message below.</p>
					<form action="mailto:support@smartemergency.local" method="POST" enctype="text/plain">
						<div class="mb-3"><label class="form-label" for="name">Name</label><input id="name" name="name" class="form-control" required></div>
						<div class="mb-3"><label class="form-label" for="email">Email</label><input id="email" name="email" type="email" class="form-control" required></div>
						<div class="mb-3"><label class="form-label" for="message">Message</label><textarea id="message" name="message" rows="5" class="form-control" required></textarea></div>
						<button type="submit" class="btn btn-primary">Send Message</button>
					</form>
					<hr>
					<p class="mb-0"><strong>Support:</strong> support@smartemergency.local</p>
				</div>
			</div>
		</div>
	</main>
</body>
</html>
