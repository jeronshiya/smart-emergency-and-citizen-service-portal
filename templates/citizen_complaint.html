<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register Complaint</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="bg-dark">
    <nav class="navbar navbar-dark bg-primary shadow">
        <div class="container">
            <a class="navbar-brand fw-bold d-flex align-items-center" href="/dashboard"><img src="{{ url_for('static', filename='images/logo.png') }}" alt="Logo" class="navbar-logo me-3"><span>Smart Emergency</span></a>
            <a href="/dashboard" class="btn btn-light">Dashboard</a>
        </div>
    </nav>

<main>
    <main class="container py-5">
        <div class="row justify-content-center">
            <div class="col-lg-7">
                <div class="card shadow p-4">
                    <h2 class="text-center text-primary mb-4">Register Complaint</h2>
                    {% if error_message %}
                        <div class="alert alert-danger" role="alert">{{ error_message }}</div>
                    {% endif %}
                    <form action="/complaint" method="POST">
                        <div class="mb-3">
                            <label class="form-label" for="category">Category</label>
                            <select id="category" name="category" class="form-select" required>
                                <option value="Public Safety">Public Safety</option>
                                <option value="Road Issue">Road Issue</option>
                                <option value="Water Supply">Water Supply</option>
                                <option value="Electricity">Electricity</option>
                                <option value="Other">Other</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label" for="location">Location</label>
                            <input id="location" type="text" name="location" class="form-control" placeholder="Use current location or enter a place name" required>
                        </div>

                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label class="form-label" for="gps_latitude">GPS Latitude</label>
                                <input id="gps_latitude" type="text" name="gps_latitude" class="form-control" placeholder="Latitude" readonly required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label" for="gps_longitude">GPS Longitude</label>
                                <input id="gps_longitude" type="text" name="gps_longitude" class="form-control" placeholder="Longitude" readonly required>
                            </div>
                        </div>

                        <div class="d-flex align-items-center gap-2 mb-3">
                            <button type="button" id="use-current-location" class="btn btn-outline-primary">Use My Current Location</button>
                            <span id="location-status" class="small text-muted">GPS coordinates are required for complaint tracking.</span>
                        </div>

                        <div class="mb-3">
                            <label class="form-label" for="description">Description</label>
                            <textarea id="description" name="description" class="form-control" rows="5" required></textarea>
                        </div>
                        <button type="submit" class="btn btn-primary w-100">Submit Complaint</button>
                    </form>
                </div>
            </div>
        </div>
    </main>

    <script>
        const locationInput = document.getElementById('location');
        const latitudeInput = document.getElementById('gps_latitude');
        const longitudeInput = document.getElementById('gps_longitude');
        const locationStatus = document.getElementById('location-status');
        const useLocationButton = document.getElementById('use-current-location');

        function setLocationFromCoordinates(latitude, longitude, addressText = '') {
            latitudeInput.value = latitude.toFixed(8);
            longitudeInput.value = longitude.toFixed(8);
            if (addressText) {
                locationInput.value = addressText;
            } else {
                locationInput.value = `GPS: ${latitude.toFixed(8)}, ${longitude.toFixed(8)}`;
            }
            locationStatus.textContent = 'Location captured successfully.';
            locationStatus.classList.remove('text-muted');
            locationStatus.classList.add('text-success');
        }

        useLocationButton.addEventListener('click', () => {
            if (!navigator.geolocation) {
                locationStatus.textContent = 'Geolocation is not supported by this browser.';
                locationStatus.classList.remove('text-success');
                locationStatus.classList.add('text-danger');
                return;
            }

            locationStatus.textContent = 'Fetching your current location...';
            locationStatus.classList.remove('text-success', 'text-danger');
            locationStatus.classList.add('text-muted');

            navigator.geolocation.getCurrentPosition(
                async (position) => {
                    const latitude = position.coords.latitude;
                    const longitude = position.coords.longitude;
                    let address = `GPS: ${latitude.toFixed(8)}, ${longitude.toFixed(8)}`;

                    try {
                        const response = await fetch(`https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${latitude}&lon=${longitude}`);
                        const data = await response.json();
                        if (data && data.display_name) {
                            address = data.display_name;
                        }
                    } catch (error) {
                        console.warn('Reverse geocoding failed:', error);
                    }

                    setLocationFromCoordinates(latitude, longitude, address);
                },
                () => {
                    locationStatus.textContent = 'Location access was denied. Please enter the location manually.';
                    locationStatus.classList.remove('text-success', 'text-muted');
                    locationStatus.classList.add('text-danger');
                },
                { enableHighAccuracy: true, timeout: 20000 }
            );
        });
    </script>
</body>
</html>
