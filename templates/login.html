<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Login</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

</head>


<body class="bg-dark" style="background: #071A2B !important;">


<nav class="navbar navbar-dark bg-primary">

<div class="container">

<a class="navbar-brand fw-bold d-flex align-items-center">

<img src="{{ url_for('static', filename='images/logo.png') }}" alt="Logo" class="navbar-logo me-3">

<span>Smart Emergency Portal</span>

</a>

</div>

</nav>

<main>

<div class="container mt-5">


<div class="row justify-content-center">


<div class="col-md-5">


<div class="card shadow p-4">


<h2 class="text-center text-primary mb-4">

Citizen Login

</h2>



<form action="/login" method="POST">

<input type="hidden" name="next" value="{{ next_url }}">

<div class="mb-3">

<label class="form-label">

Email

</label>


<input 
type="email"
name="email"
class="form-control"
required>

</div>



<div class="mb-3">

<label class="form-label">

Password

</label>


<input 
type="password"
name="password"
class="form-control"
required>

</div>



<div class="d-grid">

<button class="btn btn-primary">

Login

</button>

</div>


</form>



<div class="text-center mt-3">

<a href="/register">

Create New Account

</a>

</div>


</div>


</div>


</div>


</div>

</main>

<footer class="bg-dark text-white text-center py-4">
<h5>Smart Emergency & Citizen Service Portal</h5>
<p>© 2026 All Rights Reserved.</p>
</footer>


</body>

</html>
